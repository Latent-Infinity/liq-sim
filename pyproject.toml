[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liq-sim"
version = "0.1.1"
description = "LIQ Stack: execution simulation layer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Latent Infinity Solutions" }]
dependencies = [
    "liq-core>=0.1.1",
    "numpy>=1.26",
    "pydantic>=2.10",
    "msgspec>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.14",
    "ty>=0.0.1",
]

[tool.uv]
[tool.uv.sources]
liq-core = { path = "../liq-core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/liq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
extra-paths = ["./src"]

[tool.ty.rules]

[tool.pytest.ini_options]
addopts = "--cov=liq.sim --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
